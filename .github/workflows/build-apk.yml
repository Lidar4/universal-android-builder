name: Build Android APK

on:
  push:
    branches:
      - main
      - feature/automatic-hotspot-companion
  workflow_dispatch:

jobs:
  build:
    name: Build Release and Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK Generation
        run: |
          echo "=== Build Verification ==="
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(stat -c%s "$APK_PATH")
            if [ "$SIZE" -gt 0 ]; then
              echo "SUCCESS: APK successfully generated at $APK_PATH"
              echo "APK File Size: $SIZE bytes"
              echo "Build Target SDK: 34"
              echo "Package Name: com.universal.androidbuilder"
            else
              echo "ERROR: APK file exists but is empty (0 bytes)."
              exit 1
            fi
          else
            echo "ERROR: APK file was not found at expected path: $APK_PATH"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
